[project]
name = "nodes"
version = "0.1.0"
description = "Python data sidecar for Credix — bureau resolver, PII pipeline, memory store (serves the Mastra/Hono layer)."
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6",
    "redis>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "snowflake-connector-python>=3.7",
]

[project.optional-dependencies]
graph = [
    "langgraph>=0.2",
    "langgraph-cli[inmem]>=0.1",
    "langchain-core>=0.3",
    "langchain-openai>=0.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ for the nodes package; "." for the top-level `config` namespace.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
